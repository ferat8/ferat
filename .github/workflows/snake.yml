name: GitHub Contribution Snake
on:
  schedule:
    - cron: '0 0 * * *'  # каждый день в полночь UTC
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        run: |
          npm install -g github-contribution-snake
          github-contribution-snake --file output/github-contribution-grid-snake.svg

      - name: Commit Snake
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg
          git commit -m "🐍 Update contribution snake" || echo "No changes to commit"
          git push
